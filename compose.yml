services:
  frontend:
    image: carlso/tattooar-frontend:latest
    ports:
      - "443:443"
    restart: always
    volumes:
      - /etc/ssl/selfsigned:/etc/nginx/ssl:ro

  backend:
    image: carlso/tattooar-backend:latest
    env_file: ./env-backend/.env
    ports:
      - "4000:4000"
    restart: always